name: CI/CD Portal da Mulher

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  lint-and-test:
    name: 🧪 Validação & Testes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f django_portal_mulher/requirements.txt ]; then pip install -r django_portal_mulher/requirements.txt; fi

      - name: Executar System Checks do Django
        run: |
          cd django_portal_mulher
          python manage.py check

  build-docker:
    name: 🐳 Build da Imagem Docker
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build do Container Docker
        run: |
          docker build -t portal-mulher:latest .

  deploy:
    name: 🚀 Deploy Automático no Servidor
    runs-on: ubuntu-latest
    needs: [lint-and-test, build-docker]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Executar Deploy via SSH no Servidor Linux
        uses: appleboy/ssh-action@v1.0.3
        continue-on-error: true
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            cd ~/portal-mulher || cd /var/www/portal-mulher || exit 1
            git pull origin main
            docker-compose down
            docker-compose up -d --build
            docker exec portal_mulher_app python manage.py migrate --noinput
            docker exec portal_mulher_app python manage.py collectstatic --noinput
