{% extends 'base.html' %}
{% load static %}

{% block title %}Acesso Restrito - Portal Mulher{% endblock %}

{% block content %}
<div class="login-container" style="display: flex; justify-content: center; align-items: center; min-height: 60vh; padding: 40px 20px; background: #f9f9f9;">
    <div class="login-card" style="background: white; padding: 40px; border-radius: 10px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); width: 100%; max-width: 400px; position: relative; z-index: 2;">
        <div class="login-header" style="text-align: center; margin-bottom: 30px;">
            <div style="width: 60px; height: 60px; background: #004587; color: white; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 24px; margin: 0 auto 15px;">
                <i class="fa-solid fa-lock"></i>
            </div>
            <h2 style="color: #004587; margin-bottom: 10px; font-family: 'Montserrat', sans-serif; font-weight: 700;">Acesso Restrito</h2>
            <p style="color: #666; font-size: 0.9rem;">Área exclusiva para gestores do Portal da Mulher MT.</p>
        </div>
        
        <form method="POST" action="{% url 'login' %}">
            <div class="form-group" style="margin-bottom: 20px;">
                <label for="username" style="display: block; margin-bottom: 8px; color: #333; font-weight: 600;">Usuário</label>
                <div style="position: relative;">
                    <i class="fa-solid fa-user" style="position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: #999;"></i>
                    <input type="text" id="username" name="username" required autocomplete="off" style="width: 100%; padding: 12px 15px 12px 40px; border: 1px solid #ddd; border-radius: 5px; font-size: 1rem; outline: none; transition: 0.3s; box-sizing: border-box;" onfocus="this.style.borderColor='#004587'" onblur="this.style.borderColor='#ddd'">
                </div>
            </div>
            
            <div class="form-group" style="margin-bottom: 30px;">
                <label for="password" style="display: block; margin-bottom: 8px; color: #333; font-weight: 600;">Senha</label>
                <div style="position: relative;">
                    <i class="fa-solid fa-key" style="position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: #999;"></i>
                    <input type="password" id="password" name="password" required style="width: 100%; padding: 12px 15px 12px 40px; border: 1px solid #ddd; border-radius: 5px; font-size: 1rem; outline: none; transition: 0.3s; box-sizing: border-box;" onfocus="this.style.borderColor='#004587'" onblur="this.style.borderColor='#ddd'">
                </div>
            </div>
            
            <button type="submit" style="width: 100%; padding: 15px; background: #004587; color: white; border: none; border-radius: 5px; font-size: 1rem; font-weight: 700; cursor: pointer; transition: 0.3s;" onmouseover="this.style.background='#003366'" onmouseout="this.style.background='#004587'">
                Entrar no Sistema
            </button>
        </form>
    </div>
</div>
{% endblock %}
