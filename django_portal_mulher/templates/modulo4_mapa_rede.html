{% extends "base.html" %}
{% load static %}

{% block title %}Rede de Proteção - Mapa Interativo | Portal Mato Grosso{% endblock %}

{% block head %}
<!-- Leaflet CSS -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
<style>
    :root {
        --map-accent: #00D2D3;
        --map-blue: #004587;
        --map-bg: #f8fafc;
    }

    .map-wrapper {
        display: flex;
        height: 750px;
        background: white;
        border-radius: 24px;
        overflow: hidden;
        box-shadow: 0 20px 50px rgba(0,0,0,0.12);
        margin-top: 30px;
        border: 1px solid rgba(0,0,0,0.05);
    }

    #map {
        flex: 1;
        height: 100%;
        z-index: 1;
    }

    .map-sidebar {
        width: 380px;
        background: var(--map-bg);
        border-left: 1px solid #e2e8f0;
        display: flex;
        flex-direction: column;
        padding: 25px;
        z-index: 2;
    }

    .search-container-premium {
        position: relative;
        margin-bottom: 20px;
    }

    .search-input-premium {
        width: 100%;
        padding: 16px 20px 16px 50px;
        border-radius: 16px;
        border: 2px solid transparent;
        background: white;
        box-shadow: 0 8px 20px rgba(0,0,0,0.04);
        font-size: 0.95rem;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        color: var(--color-gov-blue);
    }

    .search-input-premium:focus {
        border-color: var(--map-accent);
        box-shadow: 0 10px 25px rgba(0, 210, 211, 0.15);
        outline: none;
    }

    .search-icon-premium {
        position: absolute;
        left: 20px;
        top: 50%;
        transform: translateY(-50%);
        color: var(--map-accent);
        font-size: 1.1rem;
    }

    .filter-pills {
        display: flex;
        gap: 10px;
        margin-bottom: 25px;
        flex-wrap: wrap;
    }

    .pill-btn {
        padding: 10px 18px;
        border-radius: 30px;
        border: 1px solid #e2e8f0;
        background: white;
        color: #64748b;
        font-size: 0.8rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s;
        display: flex;
        align-items: center;
        gap: 8px;
        box-shadow: 0 4px 6px rgba(0,0,0,0.02);
    }

    .pill-btn i {
        font-size: 0.9rem;
    }

    .pill-btn:hover {
        border-color: var(--map-accent);
        color: var(--map-accent);
        transform: translateY(-2px);
    }

    .pill-btn.active {
        background: var(--map-accent);
        color: white;
        border-color: var(--map-accent);
        box-shadow: 0 8px 20px rgba(0, 210, 211, 0.3);
    }

    .results-count {
        font-size: 0.75rem;
        color: #94a3b8;
        margin-bottom: 15px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 1px;
    }

    .points-list-premium {
        flex: 1;
        overflow-y: auto;
        padding-right: 5px;
    }

    .points-list-premium::-webkit-scrollbar {
        width: 5px;
    }

    .points-list-premium::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 10px;
    }

    .premium-card {
        background: white;
        padding: 20px;
        border-radius: 18px;
        margin-bottom: 15px;
        border: 1px solid #f1f5f9;
        cursor: pointer;
        transition: all 0.3s;
        position: relative;
    }

    .premium-card:hover {
        border-color: var(--map-accent);
        box-shadow: 0 12px 30px rgba(0,0,0,0.06);
        transform: scale(1.02);
    }

    .premium-card::before {
        content: '';
        position: absolute;
        left: 0;
        top: 50%;
        transform: translateY(-50%);
        width: 4px;
        height: 0;
        background: var(--map-accent);
        border-radius: 0 4px 4px 0;
        transition: height 0.3s;
    }

    .premium-card:hover::before {
        height: 60%;
    }

    .premium-card h5 {
        color: var(--map-blue);
        font-size: 1rem;
        margin-bottom: 8px;
        font-weight: 700;
        line-height: 1.2;
    }

    .premium-card p {
        font-size: 0.8rem;
        color: #64748b;
        margin-bottom: 4px;
        display: flex;
        align-items: flex-start;
        gap: 6px;
    }

    .premium-card p i {
        color: var(--map-accent);
        margin-top: 3px;
    }

    .type-badge-premium {
        display: inline-block;
        padding: 4px 12px;
        border-radius: 8px;
        font-size: 0.65rem;
        font-weight: 800;
        background: #f1f5f9;
        color: #475569;
        margin-top: 12px;
        text-transform: uppercase;
    }

    /* Leaflet Overrides */
    .leaflet-container {
        font-family: 'Inter', sans-serif !important;
    }

    .leaflet-popup-content-wrapper {
        border-radius: 16px;
        padding: 0;
        overflow: hidden;
        box-shadow: 0 15px 45px rgba(0,0,0,0.2);
    }

    .popup-premium-header {
        background: var(--map-blue);
        color: white;
        padding: 20px;
    }

    .popup-premium-body {
        padding: 20px;
    }

    .btn-maps-premium {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        background: var(--map-accent);
        color: white;
        padding: 12px;
        border-radius: 12px;
        text-decoration: none;
        font-weight: 700;
        font-size: 0.85rem;
        transition: opacity 0.2s;
    }

    .btn-maps-premium:hover {
        opacity: 0.9;
    }
</style>
{% endblock %}

{% block content %}
<main class="main-content">
    <div class="container">
        <h2 class="section-title">
            <div class="title-icon-svg">
                <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M50 95C50 95 90 80 90 40V15L50 5L10 15V40C10 80 50 95 50 95Z" fill="currentColor" />
                    <path d="M50 25L50 50M50 50L65 65M50 50L35 65" stroke="#00D2D3" stroke-width="8" stroke-linecap="round" />
                </svg>
            </div>
            Rede de <strong>Proteção</strong>
        </h2>

        <div class="map-wrapper">
            <div id="map"></div>
            
            <div class="map-sidebar">
                <div class="search-container-premium">
                    <i class="fa-solid fa-magnifying-glass search-icon-premium"></i>
                    <input type="text" id="mainSearch" class="search-input-premium" placeholder="Buscar unidade...">
                </div>

                <div class="search-container-premium" style="margin-bottom: 20px;">
                    <i class="fa-solid fa-city search-icon-premium"></i>
                    <select id="citySelect" class="search-input-premium" style="appearance: none; cursor: pointer;">
                        <option value="todos">Todos os Municípios</option>
                    </select>
                    <i class="fa-solid fa-chevron-down" style="position: absolute; right: 20px; top: 50%; transform: translateY(-50%); color: var(--map-accent); pointer-events: none;"></i>
                </div>

                <div class="filter-pills">
                    <button class="pill-btn active" data-type="todos">
                        <i class="fa-solid fa-layer-group"></i> Todos
                    </button>
                    <button class="pill-btn" data-type="DEDM">
                        <i class="fa-solid fa-building-shield"></i> DEDM
                    </button>
                    <button class="pill-btn" data-type="NUCLEO">
                        <i class="fa-solid fa-building-user"></i> Núcleo
                    </button>
                    <button class="pill-btn" data-type="PMP">
                        <i class="fa-solid fa-car-side"></i> PMP
                    </button>
                </div>

                <div class="results-count" id="resultsCount">Carregando unidades...</div>

                <div class="points-list-premium" id="pointsList">
                    <!-- Cards via JS -->
                </div>
            </div>
        </div>
    </div>
</main>
{% endblock %}

{% block scripts %}
<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script>
    const redesData = {{ redes_json | safe }};

    document.addEventListener('DOMContentLoaded', function() {
        const map = L.map('map', {
            zoomControl: false // Move control to a better place
        }).setView([-12.6, -56.0], 6);

        L.control.zoom({ position: 'topleft' }).addTo(map);

        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
            attribution: 'Tiles &copy; Esri &mdash; Source: Esri, DeLorme, NAVTEQ, USGS, Intermap, iPC, NRCAN, Esri Japan, METI, Esri China (Hong Kong), Esri (Thailand), TomTom, 2012',
            maxZoom: 18
        }).addTo(map);

        const mainSearch = document.getElementById('mainSearch');
        const citySelect = document.getElementById('citySelect');
        const pointsList = document.getElementById('pointsList');
        const resultsCount = document.getElementById('resultsCount');
        const markers = [];

        let currentType = 'todos';
        let currentSearch = '';
        let currentCity = 'todos';

        // Popula o select de cidades
        const cities = [...new Set(redesData.map(p => p.cidade))].sort();
        cities.forEach(city => {
            const opt = document.createElement('option');
            opt.value = city;
            opt.textContent = city;
            citySelect.appendChild(opt);
        });

        function renderPoints() {
            markers.forEach(m => map.removeLayer(m));
            markers.length = 0;
            pointsList.innerHTML = '';

            const filtered = redesData.filter(p => {
                const term = currentSearch.toLowerCase();
                const matchSearch = p.nome.toLowerCase().includes(term) || 
                                    p.endereco.toLowerCase().includes(term);
                
                const matchCity = currentCity === 'todos' || p.cidade === currentCity;

                let matchType = currentType === 'todos' || currentType === p.tipo;
                
                return matchSearch && matchType && matchCity;
            });

            resultsCount.textContent = `${filtered.length} unidades encontradas`;

            filtered.forEach(p => {
                const marker = L.marker([p.latitude, p.longitude]).addTo(map);
                
                const popupContent = `
                    <div class="popup-premium-header">
                        <strong style="display: block; font-size: 1.1rem;">${p.nome}</strong>
                        <span style="font-size: 0.8rem; opacity: 0.8;">${p.cidade}</span>
                    </div>
                    <div class="popup-premium-body">
                        <p style="font-size: 0.9rem; margin-bottom: 15px; color: #475569;">
                            <i class="fa-solid fa-location-dot" style="color: var(--map-accent);"></i> ${p.endereco}
                        </p>
                        <p style="font-weight: 800; font-size: 1rem; color: #d32f2f; margin-bottom: 20px;">
                            <i class="fa-solid fa-phone"></i> ${p.telefone}
                        </p>
                        <a href="https://www.google.com/maps/dir/?api=1&destination=${p.latitude},${p.longitude}" 
                           target="_blank" class="btn-maps-premium">
                           <i class="fa-solid fa-route"></i> ROTA GOOGLE MAPS
                        </a>
                    </div>
                `;
                
                marker.bindPopup(popupContent, { minWidth: 280, padding: 0 });
                markers.push(marker);

                const card = document.createElement('div');
                card.className = 'premium-card';
                card.innerHTML = `
                    <h5>${p.nome}</h5>
                    <p><i class="fa-solid fa-location-dot"></i> ${p.cidade}</p>
                    <p><i class="fa-solid fa-phone"></i> ${p.telefone}</p>
                    <span class="type-badge-premium">${p.tipo}</span>
                `;
                
                card.onclick = () => {
                    map.setView([p.latitude, p.longitude], 15);
                    marker.openPopup();
                };
                pointsList.appendChild(card);
            });

            if (filtered.length > 1) {
                const group = new L.featureGroup(markers);
                map.fitBounds(group.getBounds(), {padding: [70, 70]});
            } else if (filtered.length === 1) {
                map.setView([filtered[0].latitude, filtered[0].longitude], 14);
            }
        }

        mainSearch.oninput = (e) => {
            currentSearch = e.target.value;
            renderPoints();
        };

        citySelect.onchange = (e) => {
            currentCity = e.target.value;
            renderPoints();
        };

        document.querySelectorAll('.pill-btn').forEach(btn => {
            btn.onclick = function() {
                document.querySelectorAll('.pill-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                currentType = this.dataset.type;
                renderPoints();
            };
        });

        renderPoints();
    });
</script>
{% endblock %}
