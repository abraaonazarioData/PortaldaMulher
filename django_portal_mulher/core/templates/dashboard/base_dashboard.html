<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Dashboard | Portal Mulher{% endblock %}</title>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Custom CSS -->
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/dashboard.css' %}">
    
    {% block extra_css %}{% endblock %}
</head>
<body>

    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="sidebar-header">
            <i class="fa-solid fa-shield-halved" style="color: var(--primary-color); font-size: 1.5rem;"></i>
            <h2>Portal Mulher</h2>
        </div>
        
        <ul class="nav-links">
            <li>
                <a href="{% url 'dashboard_home' %}" class="{% if request.resolver_match.url_name == 'dashboard_home' %}active{% endif %}">
                    <i class="fa-solid fa-house"></i>
                    <span>Início</span>
                </a>
            </li>
            <li>
                <a href="#">
                    <i class="fa-solid fa-layer-group"></i>
                    <span>Temas</span>
                </a>
            </li>
            <li>
                <a href="#">
                    <i class="fa-solid fa-file-lines"></i>
                    <span>Conteúdos</span>
                </a>
            </li>
            <li>
                <a href="#">
                    <i class="fa-solid fa-map-location-dot"></i>
                    <span>Rede de Proteção</span>
                </a>
            </li>
        </ul>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
        <!-- Top Header -->
        <header class="top-header">
            <div class="page-title">
                <h3 style="font-weight: 600; color: var(--text-main);">{% block page_title %}Dashboard{% endblock %}</h3>
            </div>
            <div class="user-info">
                <span>Olá, {{ request.user.username|title }}</span>
                <a href="{% url 'admin:logout' %}" class="logout-btn">
                    <i class="fa-solid fa-right-from-bracket"></i> Sair
                </a>
            </div>
        </header>

        <!-- Dynamic Content -->
        <div class="content-area">
            {% block content %}
            {% endblock %}
        </div>
    </main>

    {% block extra_js %}{% endblock %}
</body>
</html>
