version: '3.3'

services:
  web:
    build: .
    container_name: portal_mulher_app
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DJANGO_DEBUG=False
      - DJANGO_ALLOWED_HOSTS=*
      - CSRF_TRUSTED_ORIGINS=http://158.69.171.5:8000,http://158.69.171.5,https://mulher.mt.gov.br
    volumes:
      - ./db.sqlite3:/app/db.sqlite3
      - ./media:/app/media
