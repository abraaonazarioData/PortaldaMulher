server {
    listen 80;
    server_name _ 192.168.171.79 172.16.101.21 mulher.mt.gov.br *.mt.gov.br;

    client_max_body_size 50M;

    # Arquivos Estáticos coletados
    location /static/ {
        alias /home/abraaonazario/Portal-Mulher-main/django_portal_mulher/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # Uploads e Imagens de Notícias
    location /media/ {
        alias /home/abraaonazario/Portal-Mulher-main/django_portal_mulher/media/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # Proxy reverso para Gunicorn
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 120s;
        proxy_read_timeout 120s;
    }
}
